name: build

on:
  pull_request:
    branches:
      - dev-ai-contest-2026
    paths-ignore:
      - '**.md'
      - 'logs/**'
      - 'LICENSE'

jobs:
  style-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout NuttX nxstyle source
        uses: actions/checkout@v4
        with:
          repository: open-vela/nuttx
          ref: dev-ai-contest-2026
          path: nuttx
          sparse-checkout: tools
          sparse-checkout-cone-mode: false

      - name: Build nxstyle
        run: |
          cd nuttx/tools
          make -f Makefile.host nxstyle
          echo "$PWD" >> $GITHUB_PATH

      - name: Run nxstyle on board files
        run: |
          FAIL=0
          for f in $(find board/ app/ arch/ -name "*.c" -o -name "*.h" 2>/dev/null); do
            OUTPUT=$(nxstyle "$f" 2>&1 \
              | grep -v "Path relative" \
              | grep -v "Relative file path does not match actual file" || true)
            if [ -n "$OUTPUT" ]; then
              echo "--- $f ---"
              echo "$OUTPUT"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "::error::nxstyle check failed"
            exit 1
          fi
          echo "nxstyle check passed"

      - name: Check line width (78 columns)
        run: |
          FAIL=0
          for f in $(find board/ app/ arch/ -name "*.c" -o -name "*.h" 2>/dev/null); do
            LONG=$(awk 'length > 78 {printf "%s:%d: line too long (%d > 78)\n", FILENAME, NR, length}' "$f" || true)
            if [ -n "$LONG" ]; then
              echo "$LONG"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "::error::Lines exceed 78 columns"
            exit 1
          fi
          echo "Line width check passed"

      - name: Check no execute permission on sources
        run: |
          FAIL=0
          for f in $(find board/ app/ arch/ -name "*.c" -o -name "*.h" 2>/dev/null); do
            if [ -x "$f" ]; then
              echo "::error file=$f::Execute permission on source file"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then exit 1; fi
          echo "Permission check passed"

      - name: Check commit messages
        run: |
          FAIL=0
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          # Skip merge commits: their subjects legitimately carry no scope
          # prefix and no Signed-off-by trailer.
          for sha in $(git log --no-merges --format="%H" "$BASE".."$HEAD"); do
            MSG=$(git log -1 --format="%B" "$sha")
            FIRST=$(echo "$MSG" | head -n1)
            if ! echo "$FIRST" | grep -qE "^[a-zA-Z0-9/_-]+: .+"; then
              echo "::error::$sha: invalid scope: $FIRST"
              FAIL=1
            fi
            LEN=${#FIRST}
            if [ "$LEN" -gt 80 ]; then
              echo "::error::$sha: subject $LEN chars (max 80)"
              FAIL=1
            fi
            if ! echo "$MSG" | grep -qE "^Signed-off-by: .+ <.+>"; then
              echo "::error::$sha: missing Signed-off-by"
              FAIL=1
            fi
            if echo "$MSG" | grep -qE "^Change-Id:"; then
              echo "::error::$sha: Gerrit Change-Id is forbidden"
              FAIL=1
            fi
            if echo "$MSG" | grep -qiE "^Co-Authored-By:"; then
              echo "::error::$sha: AI Co-Authored-By is forbidden"
              FAIL=1
            fi
            if echo "$MSG" | grep -Pq '[\x{4e00}-\x{9fff}]'; then
              echo "::error::$sha: Chinese characters in commit message"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then exit 1; fi
          echo "Commit message check passed"

      - name: Check no Chinese characters in sources
        run: |
          FAIL=0
          for f in $(find board/ app/ arch/ -name "*.c" -o -name "*.h" 2>/dev/null); do
            if grep -Pn '[\x{4e00}-\x{9fff}]' "$f"; then
              echo "::error file=$f::Chinese characters in source file"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then exit 1; fi
          echo "Chinese character check passed"

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [nsh, nsh-qemu]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Repo init
        run: |
          git config --global color.ui false
          ~/bin/repo init \
            -u https://github.com/open-vela/contest2026_137_CtrlFuture \
            -b ${{ github.event.pull_request.base.ref }} \
            -m contest2026_137_CtrlFuture.xml \
            --depth=1 \
            --groups=default,platform-linux

      - name: Repo sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          ~/bin/repo sync -c -j$(nproc) --no-tags
          df -h

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          path: contest2026_137_CtrlFuture

      - name: Symlink chip driver and patch Kconfig
        run: |
          ln -s ../../../../contest2026_137_CtrlFuture/arch/arm/stm32n6/src \
                nuttx/arch/arm/src/stm32n6
          ln -s ../../../../contest2026_137_CtrlFuture/arch/arm/stm32n6/include \
                nuttx/arch/arm/include/stm32n6
          git -C nuttx apply \
            "$GITHUB_WORKSPACE/contest2026_137_CtrlFuture/arch/arm/stm32n6/kconfig-stm32n6.patch"

      - name: Docker pull
        run: |
          docker pull ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest
          df -h

      - name: Build ${{ matrix.target }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest \
            /bin/bash -c "./build.sh vendor/openvela/boards/contest2026_137_board/configs/${{ matrix.target }} -j$(nproc)"

      - name: Binary size guard
        run: |
          SIZE=$(stat -c%s nuttx/nuttx.bin)
          MAX_SIZE=1048576
          echo "Binary size: $SIZE bytes (limit: $MAX_SIZE)"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Binary size $SIZE exceeds limit $MAX_SIZE"
            exit 1
          fi

      - name: Memory usage report
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest \
            /bin/bash -c "source build/envsetup.sh 2>/dev/null; arm-none-eabi-size nuttx/nuttx || true"

      - name: QEMU smoke test
        if: matrix.target == 'nsh-qemu'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest \
            /bin/bash -c "
              timeout 15 bash -c \"
                echo 'help' | prebuilts/qemu/linux-x86_64/bin/qemu-system-arm \
                  -machine mps3-an547 \
                  -nographic \
                  -kernel nuttx/nuttx.bin \
                  2>/dev/null
              \" > /tmp/qemu-output.log 2>&1 || true
              echo '--- QEMU output ---'
              cat /tmp/qemu-output.log
              if grep -q 'nsh>' /tmp/qemu-output.log; then
                echo 'PASS: NSH shell booted'
              else
                echo '::error::QEMU smoke test failed - NSH did not start'
                exit 1
              fi
            "

      - name: Check defconfig consistency
        if: matrix.target == 'nsh'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest \
            /bin/bash -c "./build.sh vendor/openvela/boards/contest2026_137_board/configs/nsh savedefconfig"
          if ! diff -q nuttx/defconfig contest2026_137_CtrlFuture/board/contest_board/configs/nsh/defconfig >/dev/null 2>&1; then
            echo "::warning::defconfig has drifted from savedefconfig output"
            diff nuttx/defconfig contest2026_137_CtrlFuture/board/contest_board/configs/nsh/defconfig || true
          else
            echo "PASS: defconfig consistent"
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: nuttx-${{ matrix.target }}
          path: nuttx/nuttx.bin
